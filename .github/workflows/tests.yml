name: Build and test Garmin7-Connector

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QR validation dependencies
        run: python -m pip install -r tools/requirements-keks-inspector.txt
      - name: Run host regression tests
        run: python -m unittest discover -s tools -p 'test_*.py'

  compile:
    name: Compile signed PRGs
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QR validation dependencies
        run: python -m pip install -r tools/requirements-keks-inspector.txt
      - name: Generate validated xDrip G7 KEKS source for this build
        run: python tools/embed_g7_keks_qr.py
      - name: Compile representative watch targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          # The container supplies the Connect IQ SDK/compiler and Fenix 7 /
          # Forerunner 255 device definitions. This temporary key is for
          # side-loaded testing only; it is not a persistent/store key.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            --entrypoint /bin/bash \
            ghcr.io/matco/connectiq-tester:latest \
            -lc '
              set -euo pipefail
              openssl genrsa -out /tmp/ciq-key.pem 4096 >/dev/null 2>&1
              openssl pkcs8 -topk8 -inform PEM -outform DER \
                -in /tmp/ciq-key.pem -out /tmp/ciq-key.der -nocrypt
              # Build the multi-product Connect IQ package for every product
              # declared in manifest.xml. This is the portable package for
              # the complete supported-device list.
              monkeyc -e -f monkey.jungle \
                -o build/Garmin7-Connector.iq \
                -y /tmp/ciq-key.der
              test -s build/Garmin7-Connector.iq

              # Also provide directly sideloadable PRGs for every manifest
              # product supported by this SDK image. Keep per-device failures
              # visible, but don't discard the multi-product package because
              # one optional target isn't available in the image.
              grep -oE '<iq:product id="[^"]+"/' manifest.xml \
                | sed -E 's/.*id="([^"]+)".*/\1/' \
                | while read -r device; do
                    echo "Compiling target: $device"
                    if monkeyc -f monkey.jungle -d "$device" \
                        -o "build/Garmin7-Connector-$device.prg" \
                        -y /tmp/ciq-key.der; then
                      test -s "build/Garmin7-Connector-$device.prg"
                    else
                      echo "WARNING: target $device is not buildable in this SDK image; see compiler output." >&2
                    fi
                  done
              test -n "$(find build -maxdepth 1 -name 'Garmin7-Connector-*.prg' -type f -size +0c -print -quit)"
              rm -f /tmp/ciq-key.pem /tmp/ciq-key.der
            '
      - name: Upload PRG build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Garmin7-Connector-PRG
          path: |
            build/Garmin7-Connector.iq
            build/Garmin7-Connector-*.prg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach PRGs to GitHub release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: compile
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Garmin7-Connector-PRG
          path: build
      - name: Attach PRGs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Garmin7-Connector.iq
            build/Garmin7-Connector-*.prg
